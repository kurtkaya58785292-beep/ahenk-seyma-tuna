<!DOCTYPE html>
<html lang="tr">
<head>

<title>Ahenk ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffd6e8, #ffecec);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#container {
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 30px;
}

button {
    padding: 15px 30px;
    font-size: 22px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin: 10px;
    transition: all 0.3s ease;
}

#yes {
    background: #4CAF50;
    color: white;
}

#no {
    background: #f44336;
    color: white;
    position: relative;
}

.heart {
    position: fixed;
    bottom: 0;
    font-size: 24px;
    animation: floatUp 4s linear forwards;
}

@keyframes floatUp {
    to {
        transform: translateY(-600px);
        opacity: 0;
    }
}

.flower {
    position: fixed;
    top: -40px;
    font-size: 30px;
    animation: fall 5s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}
</style>
</head>
